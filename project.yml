name: YTMusicGo
options:
  bundleIdPrefix: com.treendz
  deploymentTarget:
    iOS: "17.0"
targets:
  YTMusicGo:
    type: application
    platform: iOS
    sources: [YTMusicGo]
    info:
      path: YTMusicGo/Info.plist
      properties:
        CFBundleDisplayName: YTMusicGo
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.treendz.ytmusicgo
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UQ37S3JVJT
